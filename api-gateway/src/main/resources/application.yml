app:
  upstreams:
    service-a: http://localhost:8081
    auto-healer: http://localhost:8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 5.x / Spring Cloud 2025.x: routes live under server.webflux
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 12s
          routes:
            - id: service-a-api
              order: 0
              uri: ${app.upstreams.service-a}
              predicates:
                - Path=/api/service-a/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: serviceA
            - id: auto-healer-api
              order: 10
              uri: ${app.upstreams.auto-healer}
              predicates:
                - Path=/api/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: autoHealer
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowedMethods:
                  - GET
                  - HEAD
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

server:
  port: 8080

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      serviceA:
        baseConfig: default
      autoHealer:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    org.springframework.cloud.gateway: INFO
