server.port=8083
spring.application.name=auto-healer

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=auto-healer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic.health-events=service-health-events
app.status.recent-events-limit=200

# Comma-separated origins for the React dev server (Vite default :5173)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Prometheus HTTP API (host port when using docker-compose.observability.yml)
app.prometheus.enabled=true
app.prometheus.base-url=http://localhost:9090
app.prometheus.default-application=service-a

logging.level.com.selfhealing.auto_healer=INFO
