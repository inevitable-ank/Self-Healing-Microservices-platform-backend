server.port=8083
spring.application.name=auto-healer

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=auto-healer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic.health-events=service-health-events
app.status.recent-events-limit=200

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

logging.level.com.selfhealing.auto_healer=INFO
