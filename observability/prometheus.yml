
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: service-a
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          stack: self-healing

  - job_name: health-monitor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          stack: self-healing

  - job_name: auto-healer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          stack: self-healing
